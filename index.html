<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ADMIN | RODRIGUES</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#050505">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;900&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <style>
        :root {
            --primary: #1e1e2f; --accent: #ffffff; --glow: #6246ff;   
            --bg: #050505; --card-bg: #0d0d15; --text: #ffffff; --danger: #ff4646;
        }

        body { 
            background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; 
            margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; 
            overflow-x: hidden;
        }

        /* Foto Rodrigues */
        .profile-img {
            width: 110px; height: 110px; border-radius: 50%;
            border: 3px solid var(--glow); margin-bottom: 15px;
            object-fit: cover; box-shadow: 0 0 25px rgba(98, 70, 255, 0.3);
        }

        .mini-profile {
            width: 42px; height: 42px; border-radius: 50%;
            object-fit: cover; border: 2px solid var(--glow);
        }

        #login-div { height: 90vh; display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%; max-width: 400px; }
        .login-card { background: var(--card-bg); padding: 40px; border-radius: 12px; border: 1px solid rgba(255, 255, 255, 0.1); text-align: center; width: 100%; }
        
        input { padding: 14px; margin: 10px 0; width: 100%; background: #050505; border: 1px solid #2a2a40; color: white; border-radius: 6px; box-sizing: border-box; outline: none; }
        
        .btn-primary { padding: 14px; width: 100%; background: var(--accent); border: none; color: #000; font-weight: 900; cursor: pointer; border-radius: 6px; text-transform: uppercase; margin-top: 10px; }

        .panel { display: none; width: 100%; max-width: 1100px; animation: fadeIn 0.5s; }
        
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: var(--card-bg); padding: 25px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.05); }
        .stat-card .value { font-size: 2rem; font-weight: 900; color: var(--accent); }

        .chart-container { background: var(--card-bg); padding: 20px; border-radius: 12px; border: 1px solid rgba(255, 255, 255, 0.05); margin-bottom: 30px; height: 350px; }
        .table-container { background: var(--card-bg); border-radius: 12px; overflow: hidden; border: 1px solid rgba(255,255,255,0.05); }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 15px; font-size: 0.85rem; text-align: left; border-bottom: 1px solid rgba(255,255,255,0.05); }
        th { background: #161625; color: var(--accent); text-transform: uppercase; }

        .btn-maint { padding: 10px 20px; border: none; font-weight: bold; cursor: pointer; border-radius: 6px; transition: 0.3s; color: #000; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>

    <div id="login-div">
        <img src="https://i.ibb.co/9k9Vj1wP/image.png" alt="RODRIGUES" class="profile-img">
        <div class="login-card">
            <h2 style="color: var(--accent); font-weight: 900; margin-bottom: 20px;">RODRIGUES ADMIN</h2>
            <input type="email" id="email" placeholder="Seu E-mail">
            <input type="password" id="pass" placeholder="Sua Senha">
            <button class="btn-primary" onclick="logar()">Acessar Sistema</button>
        </div>
    </div>

    <div class="panel" id="panel">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px;">
            <div style="display: flex; align-items: center; gap: 15px;">
                 <img src="https://i.ibb.co/9k9Vj1wP/image.png" alt="User" class="mini-profile">
                 <h1 style="margin:0; font-weight: 900; letter-spacing: -1px;">ANALYTICS</h1>
            </div>
            <button id="mBtn" class="btn-maint" onclick="toggleStatus()">Carregando...</button>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <h3 style="font-size: 0.7rem; opacity: 0.5; margin-top: 0;">SALDO TOTAL RODRIGUES SHOP</h3>
                <div class="value" id="total-saldo">R$ 0,00</div>
            </div>
            <div class="stat-card">
                <h3 style="font-size: 0.7rem; opacity: 0.5; margin-top: 0;">PEDIDOS GERADOS</h3>
                <div class="value" id="total-vendas">0</div>
            </div>
        </div>

        <div class="chart-container">
            <canvas id="vendasChart"></canvas>
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr><th>DATA/HORA</th><th>CLIENTE</th><th>PRODUTO</th><th>VALOR</th></tr>
                </thead>
                <tbody id="logs"></tbody>
            </table>
        </div>
    </div>

    <script>
        // FORÇA O REGISTRO DO APP
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                .then(reg => console.log('App Registrado!'))
                .catch(err => console.log('Erro App:', err));
            });
        }

        const firebaseConfig = { 
            apiKey: "AIzaSyAoGCo4_tMeaXZsJAa2ckzi7E6zG0vQ44A", 
            authDomain: "rodrigues-shop.firebaseapp.com", 
            projectId: "rodrigues-shop", 
            storageBucket: "rodrigues-shop.firebasestorage.app", 
            messagingSenderId: "856611658964", 
            appId: "1:856611658964:web:87faee9416fc751b0a2f41" 
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();

        let vChart;
        let mStatusGlobal = false;

        function logar() {
            const e = document.getElementById('email').value;
            const s = document.getElementById('pass').value;
            auth.signInWithEmailAndPassword(e, s).then(() => {
                document.getElementById('login-div').style.display = 'none';
                document.getElementById('panel').style.display = 'block';
                initChart();
                carregarDados();
            }).catch(error => alert("Erro: " + error.message));
        }

        function initChart() {
            const ctx = document.getElementById('vendasChart').getContext('2d');
            const gradient = ctx.createLinearGradient(0, 0, 0, 400);
            gradient.addColorStop(0, 'rgba(98, 70, 255, 0.4)'); 
            gradient.addColorStop(1, 'rgba(98, 70, 255, 0)');   
            vChart = new Chart(ctx, {
                type: 'line',
                data: { labels: [], datasets: [{ label: 'Volume', data: [], borderColor: '#ffffff', borderWidth: 2, pointBackgroundColor: '#ffffff', tension: 0.4, fill: true, backgroundColor: gradient }] },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { grid: { color: 'rgba(255,255,255,0.03)' }, ticks: { color: '#555' } }, x: { grid: { display: false }, ticks: { color: '#555' } } } }
            });
        }

        function carregarDados() {
            db.collection("config").doc("site1").onSnapshot(doc => {
                if(doc.exists) {
                    mStatusGlobal = doc.data().maintenance;
                    const b = document.getElementById('mBtn');
                    b.innerText = mStatusGlobal ? "MODO MANUTENÇÃO: ON" : "SITE: ONLINE";
                    b.style.background = mStatusGlobal ? "#ff4646" : "#ffffff";
                }
            });
            db.collection("vendas_logs").orderBy("data", "desc").onSnapshot(snap => {
                let h = ""; let total = 0; let dataChart = {};
                snap.forEach(doc => {
                    const l = doc.data(); const v = parseFloat(l.valor.replace(',', '.'));
                    total += v; dataChart[l.produto] = (dataChart[l.produto] || 0) + 1;
                    h += `<tr><td>${l.data}</td><td>${l.titular}</td><td>${l.produto}</td><td style="font-weight:bold">R$ ${l.valor}</td></tr>`;
                });
                document.getElementById('logs').innerHTML = h;
                document.getElementById('total-saldo').innerText = `R$ ${total.toLocaleString('pt-br', {minimumFractionDigits: 2})}`;
                document.getElementById('total-vendas').innerText = snap.size;
                vChart.data.labels = Object.keys(dataChart); vChart.data.datasets[0].data = Object.values(dataChart); vChart.update();
            });
        }

        function toggleStatus() { db.collection("config").doc("site1").update({ maintenance: !mStatusGlobal }); }
    </script>
</body>
</html>
