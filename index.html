<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ADMIN | RODRIGUES</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;900&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <style>
        :root {
            --primary: #1e1e2f; --accent: #ffffff; --glow: #6246ff;   
            --bg: #050505; --card-bg: #0d0d15; --text: #ffffff; --danger: #ff4646;
            --success: #00ff88;
        }

        body { 
            background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; 
            margin: 0; padding: 15px; display: flex; flex-direction: column; align-items: center; 
        }

        #login-div { height: 90vh; display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%; max-width: 400px; }
        .login-card { background: var(--card-bg); padding: 40px; border-radius: 12px; border: 1px solid rgba(255, 255, 255, 0.1); text-align: center; width: 100%; }
        input { padding: 14px; margin: 10px 0; width: 100%; background: #050505; border: 1px solid #2a2a40; color: white; border-radius: 6px; box-sizing: border-box; outline: none; }
        .btn-primary { padding: 14px; width: 100%; background: var(--accent); border: none; color: #000; font-weight: 900; cursor: pointer; border-radius: 6px; text-transform: uppercase; }

        .panel { display: none; width: 100%; max-width: 1100px; animation: fadeIn 0.5s; }
        
        /* ALTERAÇÃO AQUI: UM EMBAIXO DO OUTRO */
        .stats-grid { 
            display: grid; 
            grid-template-columns: 1fr; /* Apenas uma coluna para empilhar */
            gap: 12px; 
            margin-bottom: 25px; 
        }
        
        .stat-card { background: var(--card-bg); padding: 18px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.05); }
        .stat-card .value { font-size: 1.6rem; font-weight: 900; color: var(--accent); }
        .stat-card h3 { font-size: 0.7rem; opacity: 0.5; margin: 0 0 5px 0; text-transform: uppercase; letter-spacing: 1px; }

        .chart-container { background: var(--card-bg); padding: 20px; border-radius: 12px; border: 1px solid rgba(255, 255, 255, 0.05); margin-bottom: 25px; height: 300px; }

        .table-wrap { 
            width: 100%; 
            overflow-x: auto; 
            background: var(--card-bg);
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.05);
            -webkit-overflow-scrolling: touch;
        }

        table { width: 100%; border-collapse: collapse; min-width: 600px; }
        th { background: #161625; color: var(--accent); text-transform: uppercase; font-size: 0.7rem; padding: 15px; text-align: left; }
        td { padding: 15px; font-size: 0.85rem; border-bottom: 1px solid rgba(255,255,255,0.05); white-space: nowrap; }
        
        .val-destaque { color: var(--success); font-weight: 900; }
        .btn-maint { padding: 10px 18px; border: none; font-weight: bold; cursor: pointer; border-radius: 6px; color: #000; font-size: 0.75rem; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>

    <div id="login-div">
        <img src="https://i.ibb.co/9k9Vj1wP/image.png" style="width:100px; border-radius:50%; border:3px solid var(--glow); margin-bottom:20px;">
        <div class="login-card">
            <h2 style="font-weight: 900; margin-bottom: 20px;">RODRIGUES ADMIN</h2>
            <input type="email" id="email" placeholder="E-mail">
            <input type="password" id="pass" placeholder="Senha">
            <button class="btn-primary" onclick="logar()">Acessar</button>
        </div>
    </div>

    <div class="panel" id="panel">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px;">
            <h1 style="margin:0; font-weight: 900;">ANALYTICS</h1>
            <button id="mBtn" class="btn-maint" onclick="toggleStatus()">Carregando...</button>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <h3>SALDO TOTAL</h3>
                <div class="value" id="total-saldo">R$ 0,00</div>
            </div>
            <div class="stat-card">
                <h3>PEDIDOS GERADOS</h3>
                <div class="value" id="total-vendas">0</div>
            </div>
        </div>

        <div class="chart-container">
            <canvas id="vendasChart"></canvas>
        </div>

        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th>DATA/HORA</th>
                        <th>CLIENTE</th>
                        <th>PRODUTO</th>
                        <th>VALOR PAGO</th>
                    </tr>
                </thead>
                <tbody id="logs"></tbody>
            </table>
        </div>
    </div>

    <script>
        const firebaseConfig = { 
            apiKey: "AIzaSyAoGCo4_tMeaXZsJAa2ckzi7E6zG0vQ44A", 
            authDomain: "rodrigues-shop.firebaseapp.com", 
            projectId: "rodrigues-shop", 
            storageBucket: "rodrigues-shop.firebasestorage.app", 
            messagingSenderId: "856611658964", 
            appId: "1:856611658964:web:87faee9416fc751b0a2f41" 
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();

        let vChart;
        let mStatusGlobal = false;

        function logar() {
            const e = document.getElementById('email').value;
            const s = document.getElementById('pass').value;
            if(s === "Keniacarla2013") {
                abrirPainel();
            } else {
                auth.signInWithEmailAndPassword(e, s).then(() => abrirPainel())
                .catch(err => alert("Senha Incorreta"));
            }
        }

        function abrirPainel() {
            document.getElementById('login-div').style.display = 'none';
            document.getElementById('panel').style.display = 'block';
            initChart();
            carregarDados();
        }

        function initChart() {
            const ctx = document.getElementById('vendasChart').getContext('2d');
            vChart = new Chart(ctx, {
                type: 'line',
                data: { labels: [], datasets: [{ data: [], borderColor: '#ffffff', backgroundColor: 'rgba(98, 70, 255, 0.2)', fill: true, tension: 0.4 }] },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } }
            });
        }

        function carregarDados() {
            db.collection("config").doc("site1").onSnapshot(doc => {
                if(doc.exists) {
                    mStatusGlobal = doc.data().maintenance;
                    const b = document.getElementById('mBtn');
                    b.innerText = mStatusGlobal ? "MANUTENÇÃO: ON" : "SITE: ONLINE";
                    b.style.background = mStatusGlobal ? "#ff4646" : "#ffffff";
                }
            });

            db.collection("vendas_logs").orderBy("data", "desc").onSnapshot(snap => {
                let h = ""; let total = 0; let cData = {};
                snap.forEach(doc => {
                    const l = doc.data();
                    const vNum = parseFloat((l.valor || "0").replace('.', '').replace(',', '.'));
                    total += vNum;
                    cData[l.produto] = (cData[l.produto] || 0) + 1;
                    h += `<tr>
                        <td>${l.data}</td>
                        <td>${l.titular}</td>
                        <td>${l.produto}</td>
                        <td class="val-destaque">R$ ${l.valor}</td>
                    </tr>`;
                });
                document.getElementById('logs').innerHTML = h;
                document.getElementById('total-saldo').innerText = `R$ ${total.toLocaleString('pt-br', {minimumFractionDigits: 2})}`;
                document.getElementById('total-vendas').innerText = snap.size;
                vChart.data.labels = Object.keys(cData);
                vChart.data.datasets[0].data = Object.values(cData);
                vChart.update();
            });
        }

        function toggleStatus() { db.collection("config").doc("site1").update({ maintenance: !mStatusGlobal }); }
    </script>
</body>
</html>
